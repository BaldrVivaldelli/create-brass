name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the next stable version from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: create-brass-stable
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    runs-on: ubuntu-latest
    environment: npm-stable
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Install deps (include optional)
        run: npm ci --include=optional
      - run: npm run validate:release-policy
      - run: npm run build
      - run: npm run test:templates
      - run: npm run test:templates:rollback

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
