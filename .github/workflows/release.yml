name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the next stable version from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: create-brass-stable
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    runs-on: ubuntu-latest
    environment: npm-stable
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - name: Install deps (include optional)
        run: npm ci --include=optional
      - run: npm run audit:prod
      - run: npm run validate:release-policy
      - run: npm run validate:evidence
      - run: npm run test:evidence
      - run: npm run build
      - run: npm run test:templates
      - run: npm run test:templates:rollback

      # semantic-release and its plugins are pinned here rather than kept in
      # devDependencies: their tree carries advisories with no patched release
      # (braces via micromatch, the npm CLI's bundled deps), and the lockfile
      # must pass the full npm audit gate.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          --package semantic-release@25.0.9
          --package @semantic-release/changelog@6.0.3
          --package @semantic-release/git@10.0.1
          semantic-release
