name: Publish Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact next-minor beta version
        required: true
        default: 1.3.0-beta.0
        type: string
      publish:
        description: Publish the validated tarball to npm next
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: create-brass-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - run: npm ci --include=optional
      - run: npm run audit:prod
      - run: npm run validate:release-policy
      - run: npm run validate:evidence
      - run: npm run test:evidence
      - run: npm run build
      - run: npm run test:templates
      - run: npm run test:templates:rollback

      - name: Download the public runtime beta
        run: |
          mkdir -p artifacts/runtime
          npm pack brass-runtime@2.0.0-beta.0 --pack-destination artifacts/runtime

      - name: Validate v2 and v1 bridge templates
        run: |
          npm run test:templates:v2-beta -- --runtime-tarball artifacts/runtime/brass-runtime-2.0.0-beta.0.tgz
          npm run test:templates:v1-bridge -- --runtime-tarball artifacts/runtime/brass-runtime-2.0.0-beta.0.tgz

      - name: Prepare exact beta version
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-beta.mjs "$BETA_VERSION" --write

      - name: Pack beta candidate
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/beta
          npm pack --ignore-scripts --pack-destination artifacts/beta
          test -f "artifacts/beta/create-brass-${BETA_VERSION}.tgz"
          npm publish "artifacts/beta/create-brass-${BETA_VERSION}.tgz" --dry-run --access public --tag next --json

      - uses: actions/upload-artifact@v7
        with:
          name: create-brass-beta-${{ inputs.version }}
          path: artifacts/beta/*.tgz
          if-no-files-found: error
          retention-days: 90

  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.5.1

      - uses: actions/download-artifact@v8
        with:
          name: create-brass-beta-${{ inputs.version }}
          path: artifacts/beta

      - name: Verify npm authorization and immutable inputs
        env:
          BETA_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$(npm --version)" = "11.5.1"
          npm whoami
          test -f "artifacts/beta/create-brass-${BETA_VERSION}.tgz"
          if npm view "create-brass@${BETA_VERSION}" version >/dev/null 2>&1; then
            echo "create-brass@${BETA_VERSION} already exists and cannot be overwritten" >&2
            exit 1
          fi
          echo "STABLE_LATEST_BEFORE=$(npm view create-brass dist-tags.latest)" >> "$GITHUB_ENV"

      - name: Publish beta on next
        env:
          BETA_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "artifacts/beta/create-brass-${BETA_VERSION}.tgz" --access public --tag next --provenance

      - name: Verify registry tags after propagation
        env:
          BETA_VERSION: ${{ inputs.version }}
        run: |
          published=""
          for attempt in {1..20}; do
            published="$(npm view "create-brass@${BETA_VERSION}" version 2>/dev/null || true)"
            test "$published" = "$BETA_VERSION" && break
            sleep 15
          done
          test "$published" = "$BETA_VERSION"
          test "$(npm view create-brass dist-tags.next)" = "$BETA_VERSION"
          test "$(npm view create-brass dist-tags.latest)" = "$STABLE_LATEST_BEFORE"
